version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nyayavault-db
    restart: always
    environment:
      POSTGRES_USER: nyayavault_user
      POSTGRES_PASSWORD: nyayavault_password
      POSTGRES_DB: nyayavault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
